  <text x="822" y="611" class="muted small">PRACTICE ACCOUNTS</text>
  <g font-size="12">
    <rect x="822" y="628" width="250" height="62" rx="9" fill="#fff" stroke="#dce4e9"/><text x="840" y="653" font-weight="700">Waiter</text><text x="840" y="675" class="muted tiny">Enter table orders</text>
    <rect x="1082" y="628" width="260" height="62" rx="9" fill="#fff" stroke="#dce4e9"/><text x="1100" y="653" font-weight="700">Accountant</text><text x="1100" y="675" class="muted tiny">Approve requests &amp; payments</text>
    <rect x="822" y="702" width="250" height="62" rx="9" fill="#fff" stroke="#dce4e9"/><text x="840" y="727" font-weight="700">Food Storekeeper</text><text x="840" y="749" class="muted tiny">Manage food stock</text>
    <rect x="1082" y="702" width="260" height="62" rx="9" fill="#fff" stroke="#dce4e9"/><text x="1100" y="727" font-weight="700">Beverage Storekeeper</text><text x="1100" y="749" class="muted tiny">Manage beverage stock</text>
  </g>
  <text x="822" y="817" class="subtle tiny">Frontend training build Â· No backend connected</text>
