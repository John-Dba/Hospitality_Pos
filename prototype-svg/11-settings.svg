  <rect x="282" y="634" width="1118" height="170" rx="11" class="card"/><text x="304" y="668" font-size="15" font-weight="700">Training environment</text><text x="304" y="694" class="muted small">Practice accounts and operations stay in this browser. No real business or customer information is connected.</text><rect x="304" y="722" width="1068" height="54" rx="8" fill="#f3f6f8"/><circle cx="328" cy="749" r="7" fill="#087957"/><text x="347" y="745" font-size="12" font-weight="700">Hospitality operations learning workspace</text><text x="347" y="763" class="muted tiny">Reset training data restores the original example orders, rooms, inventory and staff.</text>
