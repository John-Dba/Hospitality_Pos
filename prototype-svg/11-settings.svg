  <rect x="982" y="177" width="418" height="185" rx="11" class="card"/><text x="1004" y="211" font-size="15" font-weight="700">Role &amp; responsibilities</text><rect x="1004" y="229" width="108" height="25" rx="13" fill="#e5f3ee"/><text x="1058" y="246" text-anchor="middle" fill="#087957" class="tiny" font-weight="700">ACCOUNTANT</text><circle cx="1010" cy="278" r="3" fill="#087957"/><text x="1022" y="282" class="muted tiny">Approves or rejects kitchen stock requests.</text><circle cx="1010" cy="303" r="3" fill="#087957"/><text x="1022" y="307" class="muted tiny">Confirms payments and reviews waiter attribution.</text><circle cx="1010" cy="328" r="3" fill="#087957"/><text x="1022" y="332" class="muted tiny">Reconciles daily sales and payment records.</text>
