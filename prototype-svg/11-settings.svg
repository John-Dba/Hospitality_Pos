<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description">
  <title id="title">Hospitality POS settings</title><desc id="description">Settings screen for personal profile, appearance, role and training workspace information.</desc>
